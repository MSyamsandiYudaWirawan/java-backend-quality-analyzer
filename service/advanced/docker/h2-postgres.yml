# Postgres addendum for the h2 benchmark stack — merged by run-experiment.sh
# when the target's slots.json lists "postgres" in infra. Same envelope as
# the pre-existing template: 1 CPU / 512 MB. Credentials from slots.infraEnv.
services:
  postgres:
    image: postgres:16.9-alpine3.21
    container_name: hackathon-postgres-bench
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      - postgres_bench_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-username} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  service:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_bench_data:
