# MySQL addendum for the h2 benchmark stack — merged by run-experiment.sh
# when the target's slots.json lists "mysql" in infra. 1 CPU / 512 MB,
# mirroring the template's postgres envelope. Credentials from slots.infraEnv.
services:
  mysql:
    image: mysql:8.4
    container_name: hackathon-mysql-bench
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
    volumes:
      - mysql_bench_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD:-root} --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  service:
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_bench_data:
