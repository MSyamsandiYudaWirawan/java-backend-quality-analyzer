# Test Environment for micro1 Hackathon
# Usage: docker compose up -d
# Verifies your machine can handle the infrastructure stack.
#
# NOTE: If the problem requires per-service databases, use:
#   docker compose --profile per-service-db up -d
#
# NOTE: Prometheus + Grafana available via:
#   docker compose --profile monitoring up -d

services:
  # Default: shared Postgres with logical schema isolation.
  # Fastest to scaffold. Good enough unless the problem tests
  # distributed transactions or gives a per-service starter.docker-compose.benchmark.yml
  postgres:
    image: postgres:16.9-alpine3.21
    container_name: hackathon-postgres
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional per-service databases — enable if the problem rewards
  # distributed consistency demonstrations or provides a starter with
