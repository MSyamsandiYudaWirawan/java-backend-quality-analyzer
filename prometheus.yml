# Minimal Prometheus config for hackathon monitoring
# Only used when: docker compose --profile monitoring up -d

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'hackathon-services'
    static_configs:
      - targets:
#        - host.docker.internal:8080   # auction-service
    metrics_path: /actuator/prometheus
